# Fork-only: prove every fork decision still holds after a sync.
# Runs scripts/fork-verify.sh, which parses docs/fork-decisions.md directly —
# a decision without a proof command fails this job by construction.

name: fork-decisions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run fork proofs
        run: bash scripts/fork-verify.sh
